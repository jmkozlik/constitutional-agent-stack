[project]
name = "analyzer"
version = "0.0.1"
description = "Index a Python repo: symbol table, reference map, unresolved sites, diff-to-affected-symbols"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
harness = ["pyyaml"]
# lex v1 (the terminal operator) is the only thing that talks to the API.
# Deliberately NOT a runtime dep of the analyzer: the indexer must stay
# installable with an empty dependency list.
lex = ["anthropic"]
dev = ["pytest", "pyyaml"]

[project.scripts]
analyzer = "analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyzer", "harness", "lex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
