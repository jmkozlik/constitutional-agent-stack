# The v0 analyzer, written in the spec format the harness will eventually compile.
# Coarse on purpose. Nodes get split later, when miss telemetry says they should.
#
# Reconciled 2026-08-06 against the as-built repo (see git history for the
# original): `writes` entries now name the modules that exist. Two departures
# from the original, both reflecting build reality rather than changing intent:
#   - The implementation merged the reference walker and unresolved-site
#     detection into one module (analyzer/refs.py) — one scope walker serves
#     both. unresolved_sites therefore gained a reference on reference_map:
#     same-level nodes may not share a writes entry (E05), and the true
#     relationship is sequential, not parallel.
#   - index assembly/serialization (analyzer/indexer.py) is owned by
#     symbol_table (its done_when carries the byte-determinism criterion);
#     git plumbing (analyzer/gitio.py) is owned by affected_symbols, its
#     primary consumer.

- id: symbol_table
  one_liner: Walks a Python repo at a commit and records every function and class
             with its location, signature, and separate hashes for signature and body.
  references: []
  writes: [analyzer/modpath.py, analyzer/symbols.py, analyzer/indexer.py]
  surface:
    - "analyzer.indexer.build_index(repo: str | Path, commit: str | None) -> dict"
    - "analyzer.indexer.serialize(index: dict) -> str"
    - "analyzer.indexer.load_index(path: str | Path) -> dict"
    - "analyzer.indexer.IndexLoadError(Exception)"
    - "analyzer.symbols.extract_symbols(source: bytes, rel_path: str) -> list[dict]"
  done_when:
    - Indexing the same commit twice produces byte identical output.
    - Given a symbol path, returns its definition and signature.
    - Reformatting whitespace does not change the body hash.
    - Ranges are recomputed per commit, never stored as identity.
  open:
    - Nested functions as their own symbols, or folded into the parent?
    - Index module level constants?

- id: reference_map
  one_liner: Records every site that references each symbol, with the arguments as
             written at the call site.
  references: [symbol_table]
  writes: [analyzer/refs.py]
  surface:
    - "analyzer.refs.collect_references(tree: ast.Module, rel_path: str, mod_path: str, resolver: Resolver) -> tuple[list[tuple[str, dict]], list[dict]]"
    - "analyzer.refs.Resolver"
    - "analyzer.refs.ImportTable"
    - "analyzer.refs.ImportTable.from_module(cls, tree: ast.Module, module_path: str, *, is_package: bool = False) -> 'ImportTable'"
  done_when:
    - Given a symbol, returns every caller with file, line, and enclosing symbol.
    - Call site arguments are recorded as written, never traced to their origin.
    - Ambiguous matches are recorded as ambiguous rather than dropped.

- id: unresolved_sites
  one_liner: Records every call site whose target cannot be determined statically,
             and marks the symbols around it low confidence.
  references: [symbol_table, reference_map]
  writes: [analyzer/refs.py]
  surface:
    - "analyzer.refs.collect_references(tree: ast.Module, rel_path: str, mod_path: str, resolver: Resolver) -> tuple[list[tuple[str, dict]], list[dict]]"
  done_when:
    - A registry lookup or getattr call produces a record, never a silent skip.
    - Symbols in a file containing an unresolved site are marked low confidence.
    - A consumer can ask whether a symbol is safe to parallelize and get a straight no.

- id: affected_symbols
  one_liner: Given two commits, reports which symbols changed and whether the change
             was to the signature, the body, or only line positions.
  references: [symbol_table, reference_map]
  writes: [analyzer/affected.py, analyzer/gitio.py]
  surface:
    - "analyzer.affected.compute_affected(repo, old_rev: str, new_rev: str) -> AffectedReport"
    - "analyzer.affected.render_report(report: AffectedReport, out=sys.stdout) -> None"
    - "analyzer.gitio.changed_files(repo: str | Path, old: str, new: str) -> dict[str, tuple[list[Range], list[Range]]]"
    - "analyzer.gitio.list_py_files(repo: str | Path, rev: str) -> list[str]"
    - "analyzer.gitio.read_files(repo: str | Path, rev: str, paths: list[str]) -> dict[str, bytes]"
    - "analyzer.gitio.resolve_commit(repo: str | Path, rev: str) -> str"
    - "analyzer.gitio.GitError(Exception)"
  done_when:
    - An import added at the top of a file reports every symbol as moved, nothing as changed.
    - A body only change does not report callers as affected.
    - A signature change names every call site.
    - Deleting a symbol with recorded callers is an error, not a silent success.

- id: analyzer_cli
  one_liner: Command line entry point exposing index, symbol, affected, and unresolved.
  references: [affected_symbols, unresolved_sites]
  writes: [analyzer/cli.py, analyzer/__main__.py]
  surface:
    - "analyzer.cli.main(argv=None) -> int"
  done_when:
    - index runs on a 20k line repo in under 10 seconds.
    - Every subcommand works against a saved index file without reindexing.
